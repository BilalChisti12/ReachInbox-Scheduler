# Nginx Configuration for ReachInbox Production
#
# TWO server blocks:
#   1. HTTP  (port 80)  — redirects to HTTPS + allows Let's Encrypt challenge
#   2. HTTPS (port 443) — reverse proxy to Express API
#
# BEFORE USING:
#   Replace every occurrence of YOUR_DOMAIN_HERE with your real domain
#   e.g. api.yourdomain.com
#
# Then run: sudo certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN_HERE
# (see README.md Section 15 for full instructions)

# -----------------------------------------------------------------------
# HTTP — redirect to HTTPS (and allow Let's Encrypt HTTP-01 challenge)
# -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_HERE;

    # Let's Encrypt renewal challenge (must work over HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------
# HTTPS — reverse proxy to Express API
# -----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN_HERE;

    # SSL certificates created by certbot
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Large body size for email attachments (must be >= backend's 50mb limit)
    client_max_body_size 60m;

    # Proxy all requests to the Express API container
    location / {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;

        # Pass real client information to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for Bull Board live updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
